name: Video or content issue
description: Report an unavailable clip or a lesson-content correction
labels: [content]
body:
  - type: input
    id: lesson
    attributes:
      label: Lesson number
      placeholder: '5'
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Watch video
        - Shadow clip
        - Practice text
        - IPA chart
        - Other
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What needs attention?
      description: For a video, say whether it was removed, blocked from embedding, or mismatched with the lesson. Include a replacement link if you know one.
    validations:
      required: true
